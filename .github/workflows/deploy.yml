name: Deploy Next.js Project

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: 📬 Notifikasi Deploy Dimulai
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *Deploy Dimulai*
            📦 Repo: `${{ github.repository }}`
            💬 Commit: ${{ github.event.head_commit.message }}

      - name: 🔧 Deploy ke VPS (pull image jadi, tanpa build)
        id: deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 5m
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cd ~/projects/${{ secrets.PROJECT_FOLDER }}
            git pull origin main
            docker compose pull
            # Migrasi dijalankan dengan IMAGE BARU tapi SEBELUM container lama
            # diganti. Kalau migrasi gagal, `set -e` menghentikan deploy dan
            # container lama tetap melayani trafik — bukan container baru yang
            # bengong menunggu skema yang tidak pernah ada.
            docker compose run --rm --no-deps amarizzal-nextjs node scripts/migrate.mjs
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: ✅ Notifikasi Sukses
        if: success()
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ *Deploy BERHASIL*
            📦 `${{ github.repository }}`
            💬 ${{ github.event.head_commit.message }}
            🔗 [Lihat Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: ❌ Notifikasi Gagal
        if: failure()
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *Deploy GAGAL*
            📦 `${{ github.repository }}`
            💬 ${{ github.event.head_commit.message }}
            🔗 [Lihat Log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
